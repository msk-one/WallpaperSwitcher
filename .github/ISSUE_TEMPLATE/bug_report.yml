name: Bug report
description: Something is not working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The log is usually the fastest route to a fix —
        **Open log folder** in the tray menu takes you straight to it.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the status bar at the bottom of the window, or in the log.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-detail
    attributes:
      label: OS version, and desktop environment on Linux
      placeholder: "Windows 11 24H2, or Ubuntu 24.04 with GNOME"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose folder ...
        2. Set cadence to ...
        3. Wait until ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >
        The relevant lines from the most recent file in the log folder. Paths in
        the log may identify your folders, so redact anything you would rather
        not share.
      render: text

  - type: textarea
    id: settings
    attributes:
      label: Settings file
      description: Optional, but it makes most scheduling bugs obvious immediately.
      render: json
