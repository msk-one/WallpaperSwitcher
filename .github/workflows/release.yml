name: Release

# Each platform is built on its own runner on purpose. macOS arm64 binaries need
# at least an ad-hoc code signature to execute at all, and dotnet publish only
# applies one when it runs on macOS, so a cross-published osx-arm64 build is
# killed by the kernel on launch. No single machine can produce a valid set.
#
# Every job here runs the same script a developer would run locally, so a
# released artifact and a locally built one are produced the same way.
#
# Pushing a v* tag builds everything and drafts the release for that tag.
#
# Running it by hand is a rehearsal by default: it builds and checks all six
# artifacts and publishes nothing, which is how you find out that Inno Setup or
# hdiutil is unhappy without burning a tag. Tick "publish" and the same run puts
# the binaries on the Releases page as a prerelease tagged <branch>-<version>,
# so a build from a branch is downloadable, is never mistaken for the real
# release, and is replaced by the next build from that same branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true
      publish:
        description: "Draft the GitHub release as well, instead of only building"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      name: ${{ steps.resolve.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Wallpaper Switcher $version" >> "$GITHUB_OUTPUT"
          else
            # Built from a branch: tagged with the branch and version, so
            # successive builds from it replace each other rather than piling
            # up, and nothing collides with the v<version> release tag.
            branch="${GITHUB_REF_NAME//\//-}"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
            echo "tag=$branch-$version" >> "$GITHUB_OUTPUT"
            echo "name=Wallpaper Switcher $version ($branch)" >> "$GITHUB_OUTPUT"
          fi

      # Fails in seconds rather than after three platforms have been built.
      - name: Check the changelog has a section for this version
        shell: bash
        run: ./scripts/release-notes.sh "${{ steps.resolve.outputs.version }}"

  test:
    name: Test (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test WallpaperSwitcher.Tests/WallpaperSwitcher.Tests.csproj -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows (zip + installer)
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build zip and installer
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Version ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/zip/*.zip
            artifacts/installer/*.exe

  macos:
    name: macOS (DMG)
    needs: [version, test]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build DMGs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/package-macos-dmg.sh osx-arm64
          ./scripts/package-macos-dmg.sh osx-x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/dmg/*.dmg

  linux:
    name: Linux (${{ matrix.rid }})
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/publish-linux.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.rid }}
          path: artifacts/tar/*.tar.gz

  bundle:
    name: Collect and check artifacts
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt

      # Named rather than counted, so a rename or a platform that quietly
      # published the wrong runtime fails here instead of in someone's download.
      - name: Check every platform produced its artifacts
        shell: bash
        run: |
          missing=0
          for suffix in win-x64.zip win-x64-Setup.exe osx-arm64.dmg osx-x64.dmg linux-x64.tar.gz linux-arm64.tar.gz; do
            if [ ! -f "release/WallpaperSwitcher-$VERSION-$suffix" ]; then
              echo "Missing WallpaperSwitcher-$VERSION-$suffix" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Summarise
        shell: bash
        run: |
          {
            echo "## Wallpaper Switcher $VERSION"
            echo
            echo '| Artifact | Size |'
            echo '|---|---|'
            for f in release/*; do
              [ "$(basename "$f")" = SHA256SUMS.txt ] && continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/*

  publish:
    name: Publish (${{ needs.version.outputs.tag }})
    needs: [version, bundle]
    # A tag publishes. A manual run only publishes when asked to, so the default
    # manual run is a rehearsal.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release

      - name: Build the release notes
        shell: bash
        run: |
          if [ "${{ needs.version.outputs.channel }}" = dev ]; then
            {
              echo "**Development build** of \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA:0:7}\`."
              echo
              echo "Not a tagged release: it is replaced by the next build from the same"
              echo "branch, and it is not the download the README points at. Checksums are"
              echo "in \`SHA256SUMS.txt\` below."
              echo
              echo "---"
              echo
            } > release-notes.md
          fi
          ./scripts/release-notes.sh "${{ needs.version.outputs.version }}" >> release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          # Explicit, because the default is github.ref: on a manual run that
          # would be a bare branch name, and the release would be tagged with it.
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.name }}
          files: release/*
          body_path: release-notes.md
          # A real tag is drafted so the notes can be read before anyone sees it.
          # A branch build is published straight away, because the point of it is
          # to be downloadable, but marked prerelease and never "latest".
          draft: ${{ needs.version.outputs.channel == 'release' }}
          prerelease: ${{ needs.version.outputs.channel == 'dev' }}
          make_latest: ${{ needs.version.outputs.channel == 'release' }}
          fail_on_unmatched_files: true
