name: Release

# Each platform is built on its own runner on purpose. macOS arm64 binaries need
# at least an ad-hoc code signature to execute at all, and dotnet publish only
# applies one when it runs on macOS, so a cross-published osx-arm64 build is
# killed by the kernel on launch. No single machine can produce a valid set.
#
# Every job here runs the same script a developer would run locally, so a
# released artifact and a locally built one are produced the same way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Fails in seconds rather than after three platforms have been built.
      - name: Check the changelog has a section for this version
        shell: bash
        run: ./scripts/release-notes.sh "${{ steps.resolve.outputs.version }}"

  test:
    name: Test (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test WallpaperSwitcher.Tests/WallpaperSwitcher.Tests.csproj -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows (zip + installer)
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build zip and installer
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Version ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/zip/*.zip
            artifacts/installer/*.exe

  macos:
    name: macOS (DMG)
    needs: [version, test]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build DMGs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./scripts/package-macos-dmg.sh osx-arm64
          ./scripts/package-macos-dmg.sh osx-x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/dmg/*.dmg

  linux:
    name: Linux (${{ matrix.rid }})
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/publish-linux.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.rid }}
          path: artifacts/tar/*.tar.gz

  release:
    name: Draft release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Six artifacts: two Windows, two macOS, two Linux. A missing one means a
      # platform job uploaded nothing, which is worth failing on.
      - name: Check every platform produced its artifacts
        shell: bash
        run: |
          count=$(find release -type f ! -name 'SHA256SUMS.txt' | wc -l)
          find release -type f | sort
          if [ "$count" -ne 6 ]; then
            echo "Expected 6 release files, found $count." >&2
            exit 1
          fi

      - name: Extract release notes from the changelog
        shell: bash
        run: ./scripts/release-notes.sh "${{ needs.version.outputs.version }}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
          draft: true
          fail_on_unmatched_files: true
